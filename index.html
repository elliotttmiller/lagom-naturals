    <style id="lagom-critical-shell">
      html,body{margin:0;min-height:100%;background:#fff;color:#111713}
      #lagom-boot-shell{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;min-height:100svh;background:#fff;color:#111713;font-family:Arial,sans-serif;opacity:1;transition:opacity 460ms cubic-bezier(.16,1,.3,1)}
      .lagom-app-ready #lagom-boot-shell{opacity:0;pointer-events:none}
      .lagom-boot-shell__brand{display:grid;place-items:center}
      .lagom-boot-shell__brand>img{display:block;width:clamp(210px,30vw,320px);height:auto;max-height:108px;object-fit:contain}
      .lagom-boot-shell__brand>i{display:block;width:36px;height:2px;margin-top:20px;overflow:hidden;background:#e4e3de}
      .lagom-boot-shell__brand>i::after{content:"";display:block;width:18px;height:100%;background:#111713;animation:lagom-shell 900ms ease-in-out infinite alternate}
      .seo-fallback{position:absolute!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
      .seo-fallback__content{position:absolute!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
      @keyframes lagom-shell{from{transform:translateX(0)}to{transform:translateX(18px)}}
      @media(prefers-reduced-motion:reduce){#lagom-boot-shell{transition-duration:1ms}.lagom-boot-shell__brand>i::after{animation:none;width:100%}}
    </style>
