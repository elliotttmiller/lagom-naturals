<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Lagom Naturals | Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;color:#111510;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,480px);text-align:center}.card img{width:128px;max-height:72px;object-fit:contain;margin:0 auto 28px}.card h1{font-family:Georgia,serif;font-size:38px;font-weight:400;line-height:1;margin:0 0 14px}.card p{color:#626862;line-height:1.55;margin:0 0 22px}.card button{min-height:48px;padding:0 22px;border:0;border-radius:6px;background:#004c34;color:white;font:700 13px system-ui;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="/lagom-logo.svg" alt="Lagom Naturals" />
    <h1>You’re offline.</h1>
    <p>Reconnect to refresh inventory and current storefront information.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
