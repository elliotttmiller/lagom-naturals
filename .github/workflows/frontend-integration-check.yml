name: Frontend Integration Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/pr24-safe-primitives-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vite-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
