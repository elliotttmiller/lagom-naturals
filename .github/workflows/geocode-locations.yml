name: Geocode supplier locations

on:
  push:
    paths:
      - '.github/workflows/geocode-locations.yml'

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Resolve and cross-check supplier coordinates
        continue-on-error: true
        run: node scripts/geocode-stores.mjs
      - name: Commit coordinate verification output
        if: always()
        run: |
          if [ ! -f src/data/store-geocodes.json ] || [ ! -f src/data/store-geocode-report.json ]; then
            echo "Coordinate output files were not created."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/store-geocodes.json src/data/store-geocode-report.json
          if git diff --cached --quiet; then
            echo "No coordinate changes."
          else
            git commit -m "Capture supplier geocode verification"
            git push
          fi
