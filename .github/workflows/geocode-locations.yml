name: Geocode supplier locations

on:
  push:
    paths:
      - '.github/workflows/geocode-locations.yml'

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Resolve and cross-check supplier coordinates
        run: node scripts/geocode-stores.mjs
      - name: Upload coordinate verification
        uses: actions/upload-artifact@v4
        with:
          name: supplier-coordinate-verification
          path: |
            src/data/store-geocodes.json
            src/data/store-geocode-report.json
          if-no-files-found: error
