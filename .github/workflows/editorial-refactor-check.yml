name: Editorial Refactor Check

on:
  push:
    branches:
      - feature/editorial-lifestyle-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vite-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile production frontend
        run: npm run check
