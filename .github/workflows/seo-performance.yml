name: SEO and performance foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          SITE_ORIGIN: https://lagomnaturals.com
          GITHUB_PAGES_BASE: /lagom-naturals/
          CI: 'true'
