name: Build CRM GitHub Pages preview

on:
  push:
    branches: [main]
    paths:
      - 'crm/lagom-crm/**'
      - '.github/workflows/build-crm-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crm-pages-preview
  cancel-in-progress: true

jobs:
  build-crm-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm/lagom-crm/package-lock.json

      - name: Install CRM dependencies
        working-directory: crm/lagom-crm
        run: npm ci

      - name: Build CRM static preview
        working-directory: crm/lagom-crm
        run: npm run build:pages
        env:
          GITHUB_PAGES_BASE_PATH: /lagom-naturals/crm

      - name: Commit generated CRM preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/crm
          if git diff --cached --quiet; then
            echo "CRM preview is already current."
            exit 0
          fi
          git commit -m "Build CRM GitHub Pages preview"
          git push origin HEAD:main
