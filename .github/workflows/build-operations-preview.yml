name: Build Lagom Operations GitHub Pages preview

on:
  push:
    branches: [main]
    paths:
      - 'operations/lagom-operations/**'
      - '.github/workflows/build-operations-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lagom-operations-pages-preview
  cancel-in-progress: true

jobs:
  build-operations-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: operations/lagom-operations/package-lock.json

      - name: Install dependencies
        working-directory: operations/lagom-operations
        run: npm ci

      - name: Validate operations domain
        working-directory: operations/lagom-operations
        run: npm run validate:operations

      - name: Build Operations static preview
        working-directory: operations/lagom-operations
        run: npm run build:pages
        env:
          GITHUB_PAGES_BASE_PATH: /lagom-naturals/operations

      - name: Commit generated Operations preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/operations
          if git diff --cached --quiet; then
            echo "Operations preview is already current."
            exit 0
          fi
          git commit -m "Build Lagom Operations GitHub Pages preview"
          git push origin HEAD:main
